name: sdsremote
description: "Remote control for SDS devices."
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.2.2
  http: ^1.6.0
  image: ^4.8.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  window_manager: ^0.5.1
  logging: ^1.3.0
  dartantic_ai:
    path: packages/dartantic_ai_patched
  langchain: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  glados: ^1.1.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - docs/manual.md

